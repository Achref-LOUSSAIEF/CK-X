# CKA Simulator, based on CK-X by Sailor.sh (https://github.com/sailor-sh/CK-X)
name: cka-simulator

services:
  # VNC Server (Ubuntu)
  remote-desktop:
    image: cka-simulator/remote-desktop:local
    build:
      context: ./remote-desktop
    hostname: terminal
    shm_size: 512m # Electron and Firefox share memory through /dev/shm
    expose:
      - "5901" # VNC port (internal only)
      - "6901" # Web VNC port (internal only)
    environment:
      - VNC_PW=bakku-the-wizard
      - VNC_PASSWORD=bakku-the-wizard
      - VNC_VIEW_ONLY=false
      - VNC_RESOLUTION=1280x800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6901/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G # VSCodium (Electron) needs the extra headroom
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - ckx-network

  # Web Application (not directly exposed to users)
  webapp:
    image: cka-simulator/webapp:local
    build:
      context: ./app
    expose:
      - "3000" # Only exposed to internal network
    environment:
      - VNC_SERVICE_HOST=remote-desktop
      - VNC_SERVICE_PORT=6901
      - VNC_PASSWORD=bakku-the-wizard
      - SSH_HOST=remote-terminal
      - SSH_PORT=22
      - SSH_USER=candidate
      - SSH_PASSWORD=password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Nginx Reverse Proxy - ONLY SERVICE EXPOSED TO USERS
  nginx:
    image: cka-simulator/nginx:local
    build:
      context: ./nginx
    depends_on:
      - webapp
      - remote-desktop
      - remote-terminal
      - facilitator
      - k8s-api-server
    ports:
      - "30080:80" # Expose Nginx on port 30080
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Jump Host (ckad9999 and ckad9988)
  jumphost:
    image: cka-simulator/jumphost:local
    build:
      context: ./jumphost
    hostname: ckad9999
    privileged: true
    # No external port mappings - only accessible internally
    expose:
      - "22" # SSH port (internal only)
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      ckx-network:
        # One host name per question (cka-q1, cka-q2, ...), like the real exam's
        # "ssh <host>" per task. They all reach this same container.
        aliases:
          - ckad9999
          - cka-q1
          - cka-q2
          - cka-q3
          - cka-q4
          - cka-q5
          - cka-q6
          - cka-q7
          - cka-q8
          - cka-q9
          - cka-q10
          - cka-q11
          - cka-q12
          - cka-q13
          - cka-q14
          - cka-q15
          - cka-q16
          - cka-q17
          - cka-q18
          - cka-q19
          - cka-q20
          - cka-q21
          - cka-q22
          - cka-q23
          - cka-q24
          - cka-q25
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Remote Terminal Service
  remote-terminal:
    image: cka-simulator/remote-terminal:local
    build:
      context: ./remote-terminal
    hostname: remote-terminal
    expose:
      - "22" # SSH port (internal only)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # KIND Kubernetes Cluster
  k8s-api-server: # Service name that will be used for DNS resolution
    image: cka-simulator/cluster:local
    build:
      context: ./kind-cluster
    container_name: kind-cluster
    hostname: k8s-api-server
    privileged: true # Required for running containers inside KIND
    environment:
      - CKX_IMAGE_CACHE=true # local Docker Hub cache for the exam cluster; false to disable
    expose:
      - "6443"
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
      - ckx-docker:/var/lib/docker # k3s and k3d images survive restarts and rebuilds
      - ckx-image-cache:/var/lib/ckx-cache # local Docker Hub cache (see kind-cluster/scripts/image-cache)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "ls", "/ready"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Redis Database for Facilitator
  redis:
    image: redis:alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Facilitator Service
  facilitator:
    image: cka-simulator/facilitator:local
    build:
      context: ./facilitator
      dockerfile: Dockerfile
    hostname: facilitator
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=prod
      - SSH_HOST=jumphost
      - SSH_PORT=22
      - SSH_USERNAME=candidate
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRACK_METRICS=false # usage metrics to the external CK-X metric server are disabled in CKA Simulator
    restart: unless-stopped
    depends_on:
      - jumphost
      - redis
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ckx-network:
    name: ckx-network
    driver: bridge

volumes:
  kube-config: # Shared volume for Kubernetes configuration
  ckx-docker: # Docker data of the cluster container
  ckx-image-cache: # Images cached from Docker Hub
